<!doctype html>
<html lang="fr" data-theme-auto>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Puy du Fou</title>
<style>
:root{--bg:#faf5ee;--card:#ffffff;--ink:#2a1d1a;--mut:#7a6a63;--acc:#7b1e2b;--hi:#fcebb8;--ok:#2e7d4f;--line:#e6dccf;--veil:rgba(250,245,238,.74);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1412;--card:#2a1f1c;--ink:#f3e9e2;--mut:#b5a39a;--acc:#e07a8a;--hi:#4a3b17;--ok:#62c48a;--line:#43342f;--veil:rgba(27,20,18,.80)}}
:root[data-theme="dark"]{--bg:#1b1412;--card:#2a1f1c;--ink:#f3e9e2;--mut:#b5a39a;--acc:#e07a8a;--hi:#4a3b17;--ok:#62c48a;--line:#43342f;--veil:rgba(27,20,18,.80)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background:linear-gradient(var(--veil),var(--veil)),url(fond.jpg) center top/cover no-repeat}
body{margin:0;background:transparent;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--acc);color:#fff;z-index:5}
header h1{margin:0;padding:12px 16px 6px;font-size:18px}
nav{display:flex}
nav button{flex:1;padding:12px 8px;border:0;background:transparent;color:#fff;font-size:15px;font-weight:600;opacity:.7;border-bottom:3px solid transparent}
nav button.on{opacity:1;border-bottom-color:#fff}
main{padding:12px 12px 40px;max-width:640px;margin:0 auto}
.days{display:flex;gap:8px;margin-bottom:12px}
.days button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:600}
.days button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
a.show{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600}
a.show small{display:block;color:var(--mut);font-weight:400;font-size:13px}
a.show.must{background:var(--hi)}
.go{flex:none;font-size:20px}
.row{display:flex;gap:10px;align-items:center;padding:10px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.row.next{border:2px solid var(--acc)}
.row.done{opacity:.5}
.row.done .nm{text-decoration:line-through}
.row.pause{background:var(--veil);border-style:dashed}
.t{flex:none;width:54px;font-weight:700;text-align:center}
.b{flex:1;min-width:0}
.nm{font-weight:600}
.sub{font-size:13px;color:var(--mut)}
.act{display:flex;gap:6px;flex:none}
.act a,.act button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0}
.act .ok.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.foot button{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.note{color:var(--ink);font-size:13px;margin:12px 0;padding:8px 10px;border-radius:10px;background:var(--veil)}
h2{font-size:15px;margin:16px 2px 8px;color:var(--mut)}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:10px}
.sc.must{background:var(--hi)}
.sc.done{opacity:.55}
.sc.done .nmx{text-decoration:line-through}
.sh{display:flex;align-items:center;gap:8px}
.nmx{flex:1;min-width:0;color:var(--ink);text-decoration:none;font-weight:600}
.nmx small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:600}
.chip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
</style>
</head>

  function card(o){var p=o.p;
   var sub=(p.s?p.s:'')+(o.d!==null?(p.s?' · ':'')+(o.ex?'':'≈ ')+fd(o.d):(me?(p.s?' · ':'')+'position inconnue':''));
   h+='<div class="sc'+(has(ST.done,p.id)?' done':'')+'"><div class="sh"><a class="nmx" href="'+placeWeb(p)+'" target="_blank" rel="noopener">'+esc(p.n)+'<small>'+esc(sub)+'</small></a><div class="act"><a href="'+placeRoute(p)+'" target="_blank" rel="noopener" title="Itinéraire">🧭</a><button data-pos="'+p.id+'" title="Je suis sur place : enregistrer la position">📍</button><button class="ok'+(has(ST.done,p.id)?' on':'')+'" data-ok="'+p.id+'" title="Vu">✓</button></div></div></div>';
  }
  h+='<h2>Dans le parc</h2>';L.filter(function(o){return !o.p.h&&!o.p.r}).forEach(function(o){card(o)});
  h+='<h2>Restaurants</h2><p class="sub" style="margin:0 2px 8px">Souvent complets : réserver tôt. Liste d\'après le site du parc, à confirmer sur place (certains sont fermés hors saison).</p>';L.filter(function(o){return o.p.r}).forEach(function(o){card(o)});
  h+='<h2>Hôtels (Cité Nocturne)</h2>';L.filter(function(o){return o.p.h}).forEach(function(o){card(o)});
  h+='<p class="note">Lieux à visiter librement, sans horaire. 🧭 itinéraire à pied · 📍 à appuyer une fois sur place pour enregistrer la position exacte du lieu (sinon distance approximative « ≈ », ou lieu en bas de liste si inconnue) · ✓ déjà vu.</p>';
 } else {
  h+='<div class="days"><button class="'+(day==="sam"?"on":"")+'" data-day="sam">Samedi 3 oct</button><button class="'+(day==="dim"?"on":"")+'" data-day="dim">Dimanche 4 oct</button></div>';
  var list=PLAN.concat(ST.add).filter(function(x){return x.d===day&&!has(ST.del,x.id)}).sort(function(a,b){return mm(a.t)-mm(b.t)});
  var nextId=null;
  list.forEach(function(x){if(nextId===null&&!has(ST.done,x.id))nextId=x.id});
  list.forEach(function(x){
   var s=x.k?SH[x.k]:null,nm=s?s.n:x.n,st=mm(x.t);
   var sub=(s?'Y être à '+ff(st-MARGIN)+' · ':'')+'fin '+ff(st+x.u)+(x.o?' · '+x.o:'');
   h+='<div class="row'+(s?'':' pause')+(has(ST.done,x.id)?' done':'')+(x.id===nextId?' next':'')+'"><div class="t">'+x.t+'</div><div class="b"><div class="nm">'+(s&&s.m?'★ ':'')+esc(nm)+'</div><div class="sub">'+esc(sub)+'</div></div><div class="act">'+(s?'<a href="'+route(x.k)+'" target="_blank" rel="noopener" title="Itinéraire">🧭</a>':'')+'<button class="ok'+(has(ST.done,x.id)?' on':'')+'" data-ok="'+x.id+'" title="Fait">✓</button><button data-del="'+x.id+'" title="Supprimer">🗑</button></div></div>';
  });
  var nd=ST.del.length;
  h+='<div class="foot">'+(nd?'<button id="rs">Restaurer les éléments supprimés ('+nd+')</button>':'')+'<button id="rz">Tout remettre à zéro</button></div>';
  h+='<p class="note">✓ marque un spectacle comme fait, 🗑 le retire du programme (réversible avec « Restaurer »). Le cadre rouge indique le prochain à faire.</p>';
 }
 document.getElementById("app").innerHTML=h;
}
document.getElementById("n1").onclick=function(){tab=1;draw()};
document.getElementById("n2").onclick=function(){tab=2;draw()};
document.getElementById("n3").onclick=function(){tab=3;draw();getPos()};
document.getElementById("app").addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;
 if(t.dataset.day){day=t.dataset.day;draw()}
 else if(t.dataset.ok)toggle(ST.done,t.dataset.ok);
 else if(t.dataset.del)delItem(t.dataset.del);
 else if(t.dataset.pos){var pid2=t.dataset.pos;getPos(function(m){ST.pos[pid2]=m;save()})}
 else if(t.dataset.hr){opn=opn===t.dataset.hr?null:t.dataset.hr;draw()}
 else if(t.dataset.tm){var q=t.dataset.tm.split("|");setTime(q[0],q[1])}
 else if(t.id==="rs"){ST.del=[];save();draw()}
 else if(t.id==="rz"){ST={done:[],del:[],add:[],pos:ST.pos||{}};save();draw()}
});
draw();
</script>
</body>
</html>
